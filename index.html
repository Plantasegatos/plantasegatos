<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plantas & Gatos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="pagina-interna index">
  <div id="header"></div>

  <main>
    <h2>Últimos Posts</h2>
    <div id="posts-container"></div>
  </main>

  <div id="footer"></div>

  <script>
    fetch('blog/posts.json')
      .then(response => response.json())
      .then(posts => {
        const container = document.getElementById('posts-container');
        posts.sort((a, b) => new Date(b.data) - new Date(a.data));

        posts.forEach(post => {
          const div = document.createElement('div');
          div.className = 'post-preview';
          div.innerHTML = `
            <div class="preview-text">
              <h3><a href="${post.link}">🌿 ${post.titulo}</a></h3>
              <p>${post.trecho}</p>
            </div>
            <div class="preview-img">
              <a href="${post.link}"><img src="${post.imagem}" alt="Miniatura do post ${post.titulo}"></a>
            </div>
          `;
          container.appendChild(div);
        });
      });
  </script>
  <script src="load-common.js"></script>

  <a class="lang-switch" href="/en/">English</a>
</body>
</html>
