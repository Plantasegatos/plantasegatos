<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plantas & Gatos</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: Garamond, serif;
      background-color: #E8DCC3;
      color: #1A3A36;
    }

    .top-menu {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding: 0;
      margin: 1rem auto 0;
      max-width: 900px;
    }

    .top-menu li a {
      background-color: transparent;
      color: #E8DCC3;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      font-family: Garamond, serif;
      transition: color 0.3s, background-color 0.3s;
      padding: 0.3em 0.7em;
      display: inline-block;
    }

    .top-menu li a:hover,
    .top-menu li a.active {
      color: #D9A744;
    }

    .footer-socials {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 18px;
      margin-bottom: 12px;
    }

    .post-preview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f3e9d4;
      border-radius: 20px;
      box-shadow: 8px 8px 16px #d2c8b2,
                  -8px -8px 16px #fff3da;
      margin: 1.5em auto;
      padding: 1.2em;
      transition: all 0.3s ease-in-out;
    }

    .post-preview:hover {
      box-shadow: inset 8px 8px 16px #d2c8b2,
                  inset -8px -8px 16px #fff3da;
      transform: translateY(-2px);
    }

    .preview-text {
      max-width: 65%;
    }

    .preview-text h3 a {
      color: #1A3A36;
      text-decoration: none;
    }

    .preview-text h3 a:hover {
      text-decoration: underline;
    }

    .preview-img img {
      border-radius: 12px;
      max-width: 200px;
      height: auto;
    }

    h2 {
      text-align: center;
      margin-top: 2em;
      font-size: 1.8rem;
    }

    /* Responsividade para telas menores */
    @media (max-width: 768px) {
      .post-preview {
        flex-direction: column;
        text-align: center;
      }
      .preview-text {
        max-width: 100%;
        margin-bottom: 1em;
      }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main>
    <h2>Últimos Posts do Blog</h2>
    <div id="posts-container"></div>
  </main>

  <div id="footer"></div>

  <script>
    fetch('blog/posts.json')
      .then(response => response.json())
      .then(posts => {
        const container = document.getElementById('posts-container');
        posts.sort((a, b) => new Date(b.data) - new Date(a.data));

        posts.forEach(post => {
          const div = document.createElement('div');
          div.className = 'post-preview';
          div.innerHTML = `
            <div class="preview-text">
              <h3><a href="${post.link}">🌿 ${post.titulo}</a></h3>
              <p>${post.trecho}</p>
            </div>
            <div class="preview-img">
              <a href="${post.link}"><img src="${post.imagem}" alt="Miniatura do post ${post.titulo}"></a>
            </div>
          `;
          container.appendChild(div);
        });
      });
  </script>
  <script src="load-common.js"></script>
</body>
</html>
